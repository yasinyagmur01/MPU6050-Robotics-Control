<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotik Komuta Merkezi</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1a1b26;
            color: #a9b1d6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Panel - Loglar ve Kontrol */
        #control-panel {
            width: 350px;
            background: #24283b;
            border-right: 2px solid #414868;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        h1 { color: #7aa2f7; font-size: 24px; margin-top: 0; text-align: center; }
        
        button {
            background: #bb9af7; color: #1a1b26; border: none; padding: 15px;
            font-size: 16px; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #565f89; cursor: not-allowed; }

        #status { text-align: center; margin-top: 10px; font-weight: bold; color: #f7768e; }

        .log-box {
            margin-top: 20px; flex-grow: 1;
            background: #16161e; border-radius: 8px; padding: 10px;
            overflow-y: auto; font-family: monospace; font-size: 13px;
            border: 1px solid #414868;
        }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #24283b; padding-bottom: 5px; }
        .log-motor { color: #7dcfff; }
        .log-weapon { color: #f7768e; font-weight: bold; }

        /* Sağ Panel - Görselleştirme */
        #visual-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #24283b 0%, #1a1b26 100%);
        }

        /* --- SİLAH SİSTEMİ GÖSTERGESİ --- */
        #weapon-system {
            position: absolute; top: 40px;
            display: flex; flex-direction: column; align-items: center;
        }
        .weapon-title { font-size: 20px; letter-spacing: 3px; font-weight: bold; margin-bottom: 10px; color: #9ece6a; }
        .missile-indicator {
            width: 200px; height: 50px; border-radius: 25px;
            background: #16161e; border: 3px solid #9ece6a;
            display: flex; justify-content: center; align-items: center;
            font-size: 22px; font-weight: bold; color: #9ece6a;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(158, 206, 106, 0.2);
        }
        /* Ateşlendiğinde Kırmızı Olur */
        .missile-indicator.firing {
            border-color: #f7768e; color: #fff;
            background: #f7768e;
            box-shadow: 0 0 50px #f7768e;
            transform: scale(1.1);
        }

        /* --- ROBOT ŞASİSİ --- */
        #robot-chassis {
            position: relative;
            width: 200px; height: 250px;
            background: #414868;
            border-radius: 20px;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Yaylanma efekti */
            border: 4px solid #7aa2f7;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* Tekerlekler */
        .wheel {
            position: absolute; width: 40px; height: 80px;
            background: #16161e; border-radius: 10px; border: 2px solid #565f89;
        }
        .wheel.fl { top: 30px; left: -25px; }
        .wheel.fr { top: 30px; right: -25px; }
        .wheel.rl { bottom: 30px; left: -25px; }
        .wheel.rr { bottom: 30px; right: -25px; }

        /* Yön Okları */
        .arrow {
            position: absolute; font-size: 60px; color: #7dcfff;
            opacity: 0; transition: opacity 0.2s;
        }
        .arrow-left { left: -80px; }
        .arrow-right { right: -80px; }

        /* Motor Ateşi (Egzoz) */
        .exhaust {
            position: absolute; bottom: -40px; width: 60px; height: 40px;
            background: linear-gradient(to bottom, #ff9e64, transparent);
            border-radius: 50%; opacity: 0; transition: opacity 0.2s;
            filter: blur(5px);
        }

        /* DURUMLAR Sınıfları */
        #robot-container.turn-left #robot-chassis { transform: rotate(-35deg); }
        #robot-container.turn-left .arrow-left { opacity: 1; }
        #robot-container.turn-left .wheel.fr { transform: rotate(-10deg); } /* Sağ tekerlekler daha hızlı döner etkisi */
        #robot-container.turn-left .wheel.rr { transform: rotate(-10deg); }

        #robot-container.turn-right #robot-chassis { transform: rotate(35deg); }
        #robot-container.turn-right .arrow-right { opacity: 1; }
        #robot-container.turn-right .wheel.fl { transform: rotate(10deg); }
        #robot-container.turn-right .wheel.rl { transform: rotate(10deg); }

        /* Lazer Animasyonu */
        @keyframes fireMissile {
            0% { transform: scale(1); opacity: 1; bottom: 0; }
            100% { transform: scale(3); opacity: 0; bottom: 500px; }
        }
        .missile {
            position: absolute; width: 20px; height: 60px; background: #f7768e;
            border-radius: 10px; display: none; bottom: 125px; z-index: -1;
            box-shadow: 0 0 20px #f7768e;
        }

    </style>
</head>
<body>

    <!-- SOL KONTROL PANELİ -->
    <div id="control-panel">
        <h1>MEKANİK KONTROL</h1>
        <button id="connectBtn">📡 Telsiz Bağlantısı Kur</button>
        <div id="status">KAPALI</div>
        
        <div class="log-box" id="logBox">
            <div style="color:#565f89;">Sistem başlatıldı. Veri bekleniyor...</div>
        </div>
    </div>

    <!-- SAĞ GÖRSEL PANEL -->
    <div id="visual-panel">
        
        <!-- Silah Sistemi -->
        <div id="weapon-system">
            <div class="weapon-title" id="weapon-title">SİLAH SİSTEMİ HAZIR</div>
            <div class="missile-indicator" id="missile-indicator">
                BEKLEMEDE
            </div>
        </div>

        <!-- Robot Konteyner -->
        <div id="robot-container">
            <div class="arrow arrow-left">◀◀</div>
            <div class="arrow arrow-right">▶▶</div>
            
            <div id="robot-chassis">
                <div class="wheel fl"></div>
                <div class="wheel fr"></div>
                <div class="wheel rl"></div>
                <div class="wheel rr"></div>
                
                <!-- Robotun Gözü / Sensörü -->
                <div style="position: absolute; top: 20px; width: 100px; height: 30px; background: #1a1b26; border-radius: 15px; border: 2px solid #7aa2f7; display: flex; justify-content: center; align-items: center;">
                    <div style="width: 80px; height: 5px; background: #f7768e; box-shadow: 0 0 10px #f7768e; border-radius: 2px;"></div>
                </div>

                <div class="exhaust"></div>
                <!-- Fırlatılacak Füze -->
                <div class="missile" id="missile-obj"></div>
            </div>
        </div>

    </div>

    <script>
        const robotContainer = document.getElementById('robot-container');
        const missileInd = document.getElementById('missile-indicator');
        const weaponTitle = document.getElementById('weapon-title');
        const missileObj = document.getElementById('missile-obj');
        const logBox = document.getElementById('logBox');

        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = 'log-entry ' + (type === 'motor' ? 'log-motor' : 'log-weapon');
            const time = new Date().toLocaleTimeString().split(' ')[0];
            div.innerText = `[${time}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Arduino'dan gelen metni parse edip arayüzü güncelleyen fonksiyon
        function processCommand(line) {
            if (line.includes("[MOTOR]")) {
                if (line.includes("SAGA")) {
                    robotContainer.className = "turn-right";
                    addLog("Motorlar çalıştı: SAĞA DÖNÜŞ", "motor");
                } 
                else if (line.includes("SOLA")) {
                    robotContainer.className = "turn-left";
                    addLog("Motorlar çalıştı: SOLA DÖNÜŞ", "motor");
                } 
                else if (line.includes("Durdu") || line.includes("Merkezde")) {
                    robotContainer.className = "";
                    addLog("Motorlar durduruldu. Beklemede.", "motor");
                }
            } 
            else if (line.includes("[SİLAH]")) {
                if (line.includes("FIRLATILDI")) {
                    missileInd.className = "missile-indicator firing";
                    missileInd.innerText = "🔥🔥 FIRLATILDI 🔥🔥";
                    weaponTitle.style.color = "#f7768e";
                    weaponTitle.innerText = "YÜKLEME GEREKİYOR";
                    addLog("DİKKAT: FÜZE FIRLATILDI!", "weapon");

                    // Görsel füze animasyonu
                    missileObj.style.display = "block";
                    missileObj.style.animation = "none";
                    setTimeout(() => { missileObj.style.animation = "fireMissile 0.5s ease-in forwards"; }, 10);
                } 
                else if (line.includes("Yeniden")) {
                    missileInd.className = "missile-indicator";
                    missileInd.innerText = "BEKLEMEDE";
                    weaponTitle.style.color = "#9ece6a";
                    weaponTitle.innerText = "SİLAH SİSTEMİ HAZIR";
                    addLog("Füzeler yeniden yüklendi.", "weapon");
                    missileObj.style.display = "none";
                }
            }
        }

        // --- WEB SERIAL API ---
        let port, reader, keepReading = true;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                statusDiv.innerText = "BAĞLANTI AKTİF";
                statusDiv.style.color = "#9ece6a";
                connectBtn.disabled = true;
                addLog("Arduino bağlantısı kuruldu.", "motor");
                keepReading = true; readLoop();
            } catch (err) {
                statusDiv.innerText = "BAĞLANTI HATASI";
                statusDiv.style.color = "#f7768e";
            }
        });

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            let buffer = "";
            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        const t = line.trim();
                        if (t.length > 0 && (t.startsWith("[MOTOR]") || t.startsWith("[SİLAH]"))) {
                            processCommand(t);
                        }
                    }
                }
            } catch (error) {}
        }
    </script>
</body>
</html>
