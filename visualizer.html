<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPU6050 3D Uçak Görselleştirme</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { margin-top: 0; font-size: 1.5rem; color: #4facfe; }
        button {
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 0;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        #status { margin-top: 15px; color: #f39c12; font-size: 0.9rem; }
        
        #canvas-container { width: 100vw; height: 100vh; }

        /* KOKPİT DASHBOARD */
        #dashboard {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 40px;
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            align-items: center;
            z-index: 100;
        }

        .gauge-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .gauge-title { font-size: 0.8rem; color: #aaa; letter-spacing: 2px; }
        .gauge-val { font-size: 1.5rem; font-weight: bold; font-family: monospace; }
        
        /* Çubuk Göstergeler */
        .bar-bg { width: 150px; height: 10px; background: #333; border-radius: 5px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; background: #4facfe; position: absolute; left: 50%; width: 2px; transition: all 0.1s; }
        .bar-center { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: white; z-index: 2; transform: translateX(-50%); }

        /* Yapay Ufuk (Artificial Horizon) */
        .horizon-container {
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 4px solid #555;
            position: relative;
            overflow: hidden;
            background: #2980b9; /* Gökyüzü */
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .horizon-ground {
            width: 200%; height: 200%;
            background: #8e44ad; /* Toprak rengi */
            position: absolute;
            top: 50%; left: -50%;
            border-top: 2px solid white;
            transform-origin: top center;
            transition: transform 0.1s;
        }
        /* Uçak Simgesi (Merkez) */
        .horizon-plane {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 2px;
            background: #f1c40f;
            z-index: 10;
        }
        .horizon-plane::before { content: ''; position: absolute; width: 15px; height: 15px; border-bottom: 2px solid #f1c40f; border-left: 2px solid #f1c40f; top: -15px; left: -15px; }
        .horizon-plane::after { content: ''; position: absolute; width: 15px; height: 15px; border-bottom: 2px solid #f1c40f; border-right: 2px solid #f1c40f; top: -15px; right: -15px; }
        .horizon-dot { position: absolute; width: 6px; height: 6px; background: red; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 11; }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <h1>Bağlantı Paneli</h1>
        <button id="connectBtn">Arduino'ya Bağlan</button>
        <button id="disconnectBtn" disabled>Bağlantıyı Kes</button>
        <div id="status">Bekleniyor...</div>
    </div>

    <!-- KOKPİT GÖSTERGELERİ -->
    <div id="dashboard">
        <!-- ROLL GÖSTERGESİ -->
        <div class="gauge-col">
            <div class="gauge-title">ROLL (YATIŞ)</div>
            <div class="gauge-val" id="dash-roll">0.00°</div>
            <div class="bar-bg">
                <div class="bar-center"></div>
                <div class="bar-fill" id="bar-roll"></div>
            </div>
        </div>

        <!-- YAPAY UFUK -->
        <div class="gauge-col" style="margin: 0 20px;">
            <div class="horizon-container">
                <div class="horizon-ground" id="horizon-ground"></div>
                <div class="horizon-plane"></div>
                <div class="horizon-dot"></div>
            </div>
        </div>

        <!-- PITCH GÖSTERGESİ -->
        <div class="gauge-col">
            <div class="gauge-title">PITCH (YUNUSLAMA)</div>
            <div class="gauge-val" id="dash-pitch">0.00°</div>
            <div class="bar-bg">
                <div class="bar-center"></div>
                <div class="bar-fill" id="bar-pitch"></div>
            </div>
        </div>
        
        <!-- SICAKLIK -->
        <div class="gauge-col" style="border-left: 1px solid #444; padding-left: 20px;">
            <div class="gauge-title">SICAKLIK</div>
            <div class="gauge-val" id="dash-temp" style="color: #e74c3c;">0.0°C</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- THREE.JS KURULUMU ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1a2e');
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(30, 30, 0x4facfe, 0x444444);
        gridHelper.position.y = -4;
        scene.add(gridHelper);

        // --- UÇAK MODELİ ---
        const airplane = new THREE.Group();

        const bodyMat = new THREE.MeshPhongMaterial({ color: 0xdddddd });
        const wingMat = new THREE.MeshPhongMaterial({ color: 0xc0392b });
        const darkMat = new THREE.MeshPhongMaterial({ color: 0x111111 });

        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6, 16).rotateZ(Math.PI / 2), bodyMat);
        airplane.add(body);

        const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), darkMat);
        cockpit.position.set(1.5, 0.3, 0); cockpit.scale.set(1.5, 0.8, 0.8);
        airplane.add(cockpit);

        const wing = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 8), wingMat);
        wing.position.set(0.5, 0, 0);
        airplane.add(wing);

        const tailWing = new THREE.Mesh(new THREE.BoxGeometry(1, 0.1, 3), wingMat);
        tailWing.position.set(-2.5, 0, 0);
        airplane.add(tailWing);

        const fin = new THREE.Mesh(new THREE.BoxGeometry(1, 1.5, 0.1), wingMat);
        fin.position.set(-2.5, 0.75, 0);
        airplane.add(fin);

        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 16).rotateZ(-Math.PI / 2), bodyMat);
        nose.position.set(3.75, 0, 0);
        airplane.add(nose);

        scene.add(airplane);

        let targetRoll = 0, targetPitch = 0;

        function animate() {
            requestAnimationFrame(animate);
            airplane.rotation.x += (targetPitch - airplane.rotation.x) * 0.1;
            airplane.rotation.z += (targetRoll - airplane.rotation.z) * 0.1;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- WEB SERIAL & UI UPDATE ---
        let port, reader, keepReading = true;
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusDiv = document.getElementById('status');
        
        // UI Elementleri
        const dRoll = document.getElementById('dash-roll');
        const dPitch = document.getElementById('dash-pitch');
        const dTemp = document.getElementById('dash-temp');
        const bRoll = document.getElementById('bar-roll');
        const bPitch = document.getElementById('bar-pitch');
        const hGround = document.getElementById('horizon-ground');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                statusDiv.innerText = "Bağlandı!"; statusDiv.style.color = "#2ecc71";
                connectBtn.disabled = true; disconnectBtn.disabled = false;
                keepReading = true; readLoop();
            } catch (err) {
                statusDiv.innerText = "Hata: " + err.message; statusDiv.style.color = "#e74c3c";
            }
        });

        disconnectBtn.addEventListener('click', async () => {
            keepReading = false;
            if (reader) await reader.cancel();
            statusDiv.innerText = "Bağlantı kesildi."; statusDiv.style.color = "#f39c12";
            connectBtn.disabled = false; disconnectBtn.disabled = true;
        });

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            let buffer = "";
            try {
                while (keepReading) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) processDataLine(line.trim());
                }
            } catch (error) {} finally {
                reader.releaseLock(); await port.close();
            }
        }

        function processDataLine(line) {
            const parts = line.split('\t').map(item => item.trim()).filter(item => item !== "");
            if (parts.length >= 5) {
                const r = parseFloat(parts[2]), p = parseFloat(parts[3]), t = parseFloat(parts[4]);
                if (!isNaN(r) && !isNaN(p)) {
                    // Sayısal değerleri güncelle
                    dRoll.innerText = r.toFixed(1) + "°";
                    dPitch.innerText = p.toFixed(1) + "°";
                    dTemp.innerText = t.toFixed(1) + "°C";

                    // Roll Çubuğu (-90 ile +90 arası, genişlik max 150px)
                    let rPct = (r / 90) * 100; 
                    rPct = Math.max(-100, Math.min(100, rPct)); // Sınırla
                    if(rPct < 0) {
                        bRoll.style.left = (50 + rPct/2) + "%";
                        bRoll.style.width = Math.abs(rPct/2) + "%";
                    } else {
                        bRoll.style.left = "50%";
                        bRoll.style.width = (rPct/2) + "%";
                    }

                    // Pitch Çubuğu
                    let pPct = (p / 90) * 100;
                    pPct = Math.max(-100, Math.min(100, pPct));
                    if(pPct < 0) {
                        bPitch.style.left = (50 + pPct/2) + "%";
                        bPitch.style.width = Math.abs(pPct/2) + "%";
                    } else {
                        bPitch.style.left = "50%";
                        bPitch.style.width = (pPct/2) + "%";
                    }

                    // Yapay Ufuk Güncellemesi
                    // Pitch (Y) ekseninde kaydır, Roll ekseninde döndür
                    // Pitch: -90 ile +90 -> pixel kaydırma
                    let pitchOffset = p * 0.8; // 1 derece = 0.8px kaydırma
                    hGround.style.transform = `translateY(${pitchOffset}px) rotate(${r}deg)`;

                    // 3D Uçak güncellemesi
                    targetRoll = -(r * Math.PI / 180); 
                    targetPitch = (p * Math.PI / 180);
                }
            }
        }
    </script>
</body>
</html>
